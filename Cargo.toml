[workspace]
resolver = "2"
members = ["core", "cli"]
# The Tauri app is a standalone crate (it carries its own [profile] settings),
# so it lives outside the workspace and references core by path.
exclude = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kuranio/vercel-switchyard"
authors = ["Raúl García"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ureq = { version = "2", features = ["json"] }
